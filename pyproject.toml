[project]
name = "localevents"
version = "0.1.0"
description = "Local events around Bainbridge, Oneonta and Delhi, NY, as calendar feeds and a map"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "icalendar>=6.0",
    "recurring-ical-events>=3.0",
    "typer>=0.12",
]

[project.scripts]
localevents = "localevents.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localevents"]

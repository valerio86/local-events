<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Around Here: Bainbridge, Oneonta &amp; Delhi</title>
<meta name="description" content="Events around Bainbridge, Oneonta and Delhi, NY, on a map and as calendar feeds.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='11' fill='%232F7D4A'/><circle cx='16' cy='16' r='5' fill='%23EEF1EC'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root {
  --paper: #EEF1EC;
  --panel: #F7F8F5;
  --ink: #1E2B25;
  --ink-2: #4E5B54;
  --rule: #D3D9D2;
  --focus: #2B6CB0;
  --c-culture: #7A3E8E;
  --c-crafts: #B4531D;
  --c-outdoors: #2F7D4A;
  --c-markets: #A98200;
  --c-family: #2B6CB0;
  --c-other: #6B7068;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font: 15px/1.45 "Barlow", system-ui, sans-serif;
  display: grid;
  grid-template-columns: 400px 1fr;
  height: 100vh;
  overflow: hidden;
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { font-family: "Barlow Condensed", sans-serif; font-weight: 600; margin: 0; line-height: 1.1; }

/* Panel */
#panel {
  background: var(--panel);
  border-right: 1px solid var(--rule);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}
header { padding: 22px 22px 14px; }
h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.2px; }
.lede { margin: 6px 0 0; color: var(--ink-2); }
#range-label { font-family: "Barlow Condensed", sans-serif; font-size: 22px; font-weight: 600; margin-top: 14px; }

.filters { padding: 0 22px 12px; display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font: 500 14px "Barlow", sans-serif;
  display: inline-flex; align-items: center; gap: 7px;
  padding: 5px 10px 5px 8px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: #fff;
  color: var(--ink);
  cursor: pointer;
}
.chip .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.chip .n { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="false"] { background: transparent; color: var(--ink-2); }
.chip[aria-pressed="false"] .dot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--c); }
.toggle { padding: 0 22px 14px; color: var(--ink-2); font-size: 14px; display: flex; gap: 8px; align-items: center; }
.toggle input { accent-color: var(--ink); margin: 0; }

#list { border-top: 1px solid var(--rule); flex: 1; }
.day { padding: 14px 22px 4px; font-family: "Barlow Condensed", sans-serif; font-size: 18px; font-weight: 600; position: sticky; top: 0; background: var(--panel); z-index: 1; }
.ev {
  display: grid; grid-template-columns: 58px 1fr; gap: 10px;
  padding: 7px 22px 7px 19px;
  border-left: 3px solid var(--c);
  margin: 0 0 2px;
  cursor: pointer;
}
.ev:hover, .ev.active { background: #fff; }
.ev time { color: var(--ink-2); font-variant-numeric: tabular-nums; font-size: 14px; padding-top: 1px; }
.ev .t { font-weight: 600; }
.ev .where { color: var(--ink-2); font-size: 13.5px; }
.ev .rep { color: var(--ink-2); font-size: 12.5px; }
.empty { padding: 22px; color: var(--ink-2); }

section.subscribe, footer { padding: 18px 22px; border-top: 1px solid var(--rule); }
section.subscribe h2 { font-size: 22px; }
section.subscribe p, footer { color: var(--ink-2); font-size: 13.5px; }
.feed { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--rule); }
.feed:last-child { border-bottom: 0; }
.feed .name { display: flex; gap: 8px; align-items: center; }
.feed .name .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
.btn { font: 500 13px "Barlow", sans-serif; padding: 3px 9px; border: 1px solid var(--rule); border-radius: 4px; background: #fff; color: var(--ink); text-decoration: none; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--ink-2); }
footer ul { margin: 6px 0 10px; padding-left: 18px; }
footer .err { color: #9B2C2C; }

/* Map + timeline */
#stage { position: relative; display: grid; grid-template-rows: 1fr auto; min-height: 0; }
#map { min-height: 0; background: #DDE3DC; }
.leaflet-tile-pane { filter: saturate(0.35) contrast(0.92) brightness(1.04); }
.leaflet-container { font-family: "Barlow", sans-serif; }
.leaflet-popup-content { margin: 12px 14px; font-size: 14px; line-height: 1.4; min-width: 220px; }
.pop h3 { font-size: 19px; margin-bottom: 2px; }
.pop .sub { color: var(--ink-2); font-size: 13px; margin-bottom: 8px; }
.pop ul { list-style: none; margin: 0; padding: 0; max-height: 240px; overflow-y: auto; }
.pop li { border-left: 3px solid var(--c); padding: 2px 0 2px 8px; margin-bottom: 6px; }
.pop li time { color: var(--ink-2); font-size: 13px; display: block; }
.town-label { font-family: "Barlow Condensed", sans-serif; font-size: 15px; font-weight: 700; color: var(--ink); text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff; white-space: nowrap; }

#timeline { background: var(--panel); border-top: 1px solid var(--rule); padding: 10px 18px 12px; }
.tl-head { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
.tl-head .hint { margin-left: auto; color: var(--ink-2); font-size: 13px; }
.preset[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
#tl { width: 100%; height: 96px; display: block; touch-action: none; user-select: none; }
#tl .brush { fill: var(--ink); fill-opacity: 0.07; stroke: var(--ink); stroke-width: 1.5; cursor: grab; }
#tl .brush:active { cursor: grabbing; }
#tl .handle { fill: var(--ink); cursor: ew-resize; }
#tl .today { stroke: #9B2C2C; stroke-width: 1.5; }
#tl text { font: 12px "Barlow", sans-serif; fill: var(--ink-2); }
#tl text.month { font-weight: 600; fill: var(--ink); }
#tl .past { fill: var(--paper); fill-opacity: 0.6; }

@media (max-width: 820px) {
  body { display: block; height: auto; overflow: visible; }
  #stage { height: 72vh; }
  #panel { border-right: 0; overflow: visible; }
  .day { position: static; }
  header, .filters, .toggle { padding-left: 16px; padding-right: 16px; }
  .ev { padding-right: 16px; padding-left: 13px; }
  section.subscribe, footer { padding-left: 16px; padding-right: 16px; }
  #timeline { padding: 8px 10px 10px; }
  .tl-head .hint { display: none; }
  #stage { order: -1; }
  body { display: flex; flex-direction: column; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<aside id="panel">
  <header>
    <h1>Around Here</h1>
    <p class="lede">Events in and between Bainbridge, Oneonta and Delhi, gathered from local calendars every morning.</p>
    <div id="range-label" aria-live="polite"></div>
  </header>
  <div class="filters" id="filters" role="group" aria-label="Categories"></div>
  <label class="toggle"><input type="checkbox" id="hide-series"> Hide weekly regulars (story times, clubs, markets)</label>
  <div id="list"></div>
  <section class="subscribe">
    <h2>Put these on your calendar</h2>
    <p>Each feed updates by itself. Google Calendar checks for changes about once a day.</p>
    <div id="feeds"></div>
  </section>
  <footer id="footer"></footer>
</aside>
<main id="stage">
  <div id="map" aria-label="Map of events"></div>
  <div id="timeline">
    <div class="tl-head" id="presets">
      <button class="btn preset" data-p="today">Today</button>
      <button class="btn preset" data-p="weekend">This weekend</button>
      <button class="btn preset" data-p="week">Next 7 days</button>
      <button class="btn preset" data-p="month">Next 30 days</button>
      <span class="hint">Drag the window, or its edges, to change dates</span>
    </div>
    <svg id="tl" role="slider" aria-label="Date range" tabindex="0"></svg>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>const DATA = /*__DATA__*/null;</script>
<script>
(() => {
const DAY = 864e5;
const css = getComputedStyle(document.documentElement);
const color = k => css.getPropertyValue(`--c-${k}`).trim();
const cats = Object.keys(DATA.categories);
const parseDay = s => { const [y, m, d] = s.slice(0, 10).split("-").map(Number); return new Date(y, m - 1, d); };
const dayIndex = d => Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - first) / DAY);

const events = DATA.events.map(e => ({ ...e, s: new Date(e.start), e: e.end ? new Date(e.end) : null }));
const first = parseDay(DATA.window[0]);
const nDays = Math.round((parseDay(DATA.window[1]) - first) / DAY);
const todayI = Math.round((parseDay(DATA.today) - first) / DAY);
events.forEach(e => e.di = dayIndex(e.s));

const state = {
  on: new Set(cats),
  hideSeries: false,
  from: todayI, to: todayI + 7,  // [from, to) in day indices
  active: null,
};

const fmtDay = new Intl.DateTimeFormat("en-US", { weekday: "long", month: "short", day: "numeric" });
const fmtShort = new Intl.DateTimeFormat("en-US", { weekday: "short", month: "short", day: "numeric" });
const fmtTime = new Intl.DateTimeFormat("en-US", { hour: "numeric", minute: "2-digit" });
const dateOf = i => new Date(first.getTime() + i * DAY + 12 * 36e5);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const timeOf = e => e.all_day ? "All day" : fmtTime.format(e.s).replace(":00", "").replace(" ", " ");

const visible = () => events.filter(e =>
  state.on.has(e.category) && !(state.hideSeries && e.series) && e.di >= state.from && e.di < state.to);

/* ---------- Map ---------- */
const map = L.map("map", { zoomControl: true, attributionControl: true });
map.fitBounds(L.latLngBounds(Object.values(DATA.towns)).pad(0.35));
L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", {
  maxZoom: 16,
  attribution: 'Map: &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>, <a href="https://opentopomap.org">OpenTopoMap</a> (CC-BY-SA)',
}).addTo(map);

for (const [name, ll] of Object.entries(DATA.towns)) {
  L.circle(ll, { radius: 25 * 1609, color: "#1E2B25", weight: 1.2, opacity: 0.45, dashArray: "5 7", fill: false, interactive: false }).addTo(map);
  L.marker(ll, { interactive: false, icon: L.divIcon({ className: "town-label", html: name, iconSize: null, iconAnchor: [-14, 26] }) }).addTo(map);
}

const layer = L.layerGroup().addTo(map);
const markerByKey = new Map();

function renderMap(list) {
  layer.clearLayers();
  markerByKey.clear();
  const groups = new Map();
  for (const e of list) {
    if (e.lat == null) continue;
    const k = `${e.lat},${e.lon}`;
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(e);
  }
  // Big venues first so small ones stay clickable on top.
  const sorted = [...groups.entries()].sort((a, b) => b[1].length - a[1].length);
  for (const [k, evs] of sorted) {
    const counts = {};
    evs.forEach(e => counts[e.category] = (counts[e.category] || 0) + 1);
    const main = Object.entries(counts).sort((a, b) => b[1] - a[1])[0][0];
    const approx = evs.every(e => e.geo_approx);
    const m = L.circleMarker([evs[0].lat, evs[0].lon], {
      radius: 5 + 3.2 * Math.sqrt(evs.length),
      color: approx ? color(main) : "#fff",
      weight: approx ? 2 : 1.5,
      dashArray: approx ? "3 3" : null,
      fillColor: color(main),
      fillOpacity: approx ? 0.35 : 0.9,
    });
    const place = evs[0].location.replace(/\\,/g, ",").split(",")[0] || evs[0].title;
    m.bindPopup(() => `<div class="pop">
      <h3>${esc(place)}</h3>
      <div class="sub">${evs.length} event${evs.length > 1 ? "s" : ""} in this window${approx ? ". Location is approximate, from the event name." : ""}</div>
      <ul>${evs.map(e => `<li style="--c:${color(e.category)}"><time>${fmtShort.format(e.s)}, ${timeOf(e)}</time>${e.url ? `<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a>` : esc(e.title)}</li>`).join("")}</ul>
    </div>`, { maxWidth: 300 });
    m.addTo(layer);
    evs.forEach(e => markerByKey.set(e.uid, m));
  }
}

/* ---------- List ---------- */
const listEl = document.getElementById("list");
function renderList(list) {
  if (!list.length) {
    listEl.innerHTML = `<p class="empty">Nothing in these dates for the selected categories. Widen the window on the timeline, or turn a category back on.</p>`;
    return;
  }
  let html = "", lastDay = -1;
  for (const e of list) {
    if (e.di !== lastDay) { html += `<h3 class="day">${fmtDay.format(dateOf(e.di))}</h3>`; lastDay = e.di; }
    const where = e.location ? e.location.replace(/\\,/g, ",").split(",").slice(0, 2).join(",") : "";
    html += `<div class="ev" tabindex="0" data-uid="${e.uid}" style="--c:${color(e.category)}">
      <time>${timeOf(e)}</time>
      <div><div class="t">${esc(e.title)}</div>${where ? `<div class="where">${esc(where)}${e.lat == null ? " (not on map)" : ""}</div>` : ""}${e.series ? `<div class="rep">Repeats</div>` : ""}</div>
    </div>`;
  }
  listEl.innerHTML = html;
}
function focusEvent(uid) {
  const m = markerByKey.get(uid);
  const e = events.find(x => x.uid === uid);
  if (!m) { if (e && e.url) window.open(e.url, "_blank", "noopener"); return; }
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  map.flyTo(m.getLatLng(), Math.max(map.getZoom(), 12), { animate: !reduce, duration: 0.6 });
  m.openPopup();
  if (matchMedia("(max-width: 820px)").matches) document.getElementById("map").scrollIntoView({ behavior: reduce ? "auto" : "smooth" });
}
listEl.addEventListener("click", ev => { const el = ev.target.closest(".ev"); if (el) focusEvent(el.dataset.uid); });
listEl.addEventListener("keydown", ev => { const el = ev.target.closest(".ev"); if (el && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); focusEvent(el.dataset.uid); } });

/* ---------- Filters ---------- */
const filtersEl = document.getElementById("filters");
function renderFilters() {
  const inWindow = events.filter(e => !(state.hideSeries && e.series) && e.di >= state.from && e.di < state.to);
  filtersEl.innerHTML = cats.map(k => {
    const n = inWindow.filter(e => e.category === k).length;
    return `<button class="chip" data-k="${k}" aria-pressed="${state.on.has(k)}" style="--c:${color(k)}"><span class="dot"></span>${esc(DATA.categories[k])} <span class="n">${n}</span></button>`;
  }).join("");
}
filtersEl.addEventListener("click", ev => {
  const b = ev.target.closest(".chip"); if (!b) return;
  const k = b.dataset.k;
  // Clicking the only active category turns everything back on.
  if (state.on.has(k) && state.on.size === 1) cats.forEach(c => state.on.add(c));
  else if (ev.altKey || ev.metaKey) { state.on = new Set([k]); }
  else state.on.has(k) ? state.on.delete(k) : state.on.add(k);
  update();
});
document.getElementById("hide-series").addEventListener("change", ev => { state.hideSeries = ev.target.checked; update(); });

/* ---------- Timeline ---------- */
const svg = document.getElementById("tl");
const NS = "http://www.w3.org/2000/svg";
const PAD = { l: 4, r: 4, t: 18, b: 4 };
let W = 0, H = 96, dayW = 0;
const xOf = i => PAD.l + i * dayW;
const el = (tag, attrs) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); return n; };

function renderTimeline() {
  W = svg.clientWidth; dayW = (W - PAD.l - PAD.r) / nDays;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.replaceChildren();
  const perDay = Array.from({ length: nDays }, () => Object.fromEntries(cats.map(k => [k, 0])));
  for (const e of events) {
    if (e.di < 0 || e.di >= nDays || !state.on.has(e.category) || (state.hideSeries && e.series)) continue;
    perDay[e.di][e.category]++;
  }
  const maxN = Math.max(1, ...perDay.map(d => Object.values(d).reduce((a, b) => a + b, 0)));
  const barH = H - PAD.t - PAD.b;
  const gap = dayW > 6 ? 1.5 : 0.5;
  perDay.forEach((d, i) => {
    let y = H - PAD.b;
    for (const k of cats) {
      if (!d[k]) continue;
      const h = d[k] / maxN * barH;
      y -= h;
      svg.append(el("rect", { x: xOf(i) + gap / 2, y, width: Math.max(0.5, dayW - gap), height: h, fill: color(k) }));
    }
    const dt = dateOf(i);
    if (dt.getDate() === 1 || i === 0) {
      const t = el("text", { x: xOf(i) + 2, y: 12, class: "month" });
      t.textContent = dt.toLocaleDateString("en-US", { month: "long" });
      svg.append(t);
    } else if (dt.getDay() === 1 && dayW * 7 > 44 && dt.getDate() > 5) {
      const t = el("text", { x: xOf(i) + 2, y: 12 });
      t.textContent = dt.getDate();
      svg.append(t);
    }
  });
  svg.append(el("rect", { class: "past", x: PAD.l, y: PAD.t, width: Math.max(0, xOf(todayI) - PAD.l), height: barH }));
  svg.append(el("line", { class: "today", x1: xOf(todayI), x2: xOf(todayI), y1: PAD.t - 4, y2: H - PAD.b }));
  const bx = xOf(state.from), bw = (state.to - state.from) * dayW;
  svg.append(el("rect", { class: "brush", id: "brush", x: bx, y: PAD.t - 3, width: bw, height: barH + 3, rx: 3 }));
  svg.append(el("rect", { class: "handle", "data-edge": "from", x: bx - 3, y: PAD.t + barH / 2 - 14, width: 6, height: 28, rx: 3 }));
  svg.append(el("rect", { class: "handle", "data-edge": "to", x: bx + bw - 3, y: PAD.t + barH / 2 - 14, width: 6, height: 28, rx: 3 }));
}

let drag = null;
svg.addEventListener("pointerdown", ev => {
  const r = svg.getBoundingClientRect();
  const i = (ev.clientX - r.left - PAD.l) / dayW;
  const edge = ev.target.dataset && ev.target.dataset.edge;
  if (edge) drag = { edge };
  else if (ev.target.id === "brush") drag = { edge: "move", offset: i - state.from, len: state.to - state.from };
  else { // click outside the window: center a same-length window there
    const len = state.to - state.from;
    setRange(Math.round(i - len / 2), Math.round(i - len / 2) + len);
    drag = { edge: "move", offset: len / 2, len };
  }
  svg.setPointerCapture(ev.pointerId);
});
svg.addEventListener("pointermove", ev => {
  if (!drag) return;
  const r = svg.getBoundingClientRect();
  const i = (ev.clientX - r.left - PAD.l) / dayW;
  if (drag.edge === "move") { const f = Math.round(i - drag.offset); setRange(f, f + drag.len); }
  else if (drag.edge === "from") setRange(Math.min(Math.round(i), state.to - 1), state.to);
  else setRange(state.from, Math.max(Math.round(i), state.from + 1));
});
svg.addEventListener("pointerup", () => drag = null);
svg.addEventListener("keydown", ev => {
  const step = ev.shiftKey ? 7 : 1;
  if (ev.key === "ArrowRight") { setRange(state.from + step, state.to + step); ev.preventDefault(); }
  if (ev.key === "ArrowLeft") { setRange(state.from - step, state.to - step); ev.preventDefault(); }
});

function setRange(from, to, preset = null) {
  const len = to - from;
  from = Math.max(0, Math.min(from, nDays - len));
  to = Math.min(nDays, from + len);
  if (from === state.from && to === state.to && preset === state.preset) return;
  Object.assign(state, { from, to, preset });
  update();
}
document.getElementById("presets").addEventListener("click", ev => {
  const b = ev.target.closest(".preset"); if (!b) return;
  const t = todayI, wd = dateOf(t).getDay();
  const p = b.dataset.p;
  if (p === "today") setRange(t, t + 1, p);
  if (p === "week") setRange(t, t + 7, p);
  if (p === "month") setRange(t, t + 30, p);
  if (p === "weekend") { const sat = wd === 0 ? t - 1 : t + (6 - wd); setRange(Math.max(t, sat), sat + 2, p); }
});

/* ---------- Feeds + footer ---------- */
function renderFeeds() {
  const base = location.protocol.startsWith("http") ? new URL(".", location.href) : null;
  const rows = [["all", "Everything"], ...cats.map(k => [k, DATA.categories[k]])];
  document.getElementById("feeds").innerHTML = rows.map(([k, label]) => {
    const url = base ? new URL(`${k}.ics`, base).href : `${k}.ics`;
    const webcal = url.replace(/^https?:/, "webcal:");
    const g = `https://calendar.google.com/calendar/r?cid=${encodeURIComponent(webcal)}`;
    return `<div class="feed">
      <span class="name"><span class="dot" style="--c:${k === "all" ? "var(--ink)" : color(k)}"></span>${esc(label)}</span>
      <a class="btn" href="${base ? g : "#"}" target="_blank" rel="noopener" ${base ? "" : 'aria-disabled="true"'}>Add to Google</a>
      <button class="btn copy" data-url="${esc(webcal)}">Copy link</button>
    </div>`;
  }).join("") + (base ? "" : `<p>Links work once the page is published.</p>`);
}
document.getElementById("feeds").addEventListener("click", async ev => {
  const b = ev.target.closest(".copy"); if (!b) return;
  try { await navigator.clipboard.writeText(b.dataset.url); b.textContent = "Copied"; }
  catch { b.textContent = "Copy failed"; }
  setTimeout(() => b.textContent = "Copy link", 1600);
});

function renderFooter() {
  const unlocated = events.filter(e => e.lat == null).length;
  const gen = new Date(DATA.generated);
  document.getElementById("footer").innerHTML = `
    <div>Updated ${fmtShort.format(gen)} at ${fmtTime.format(gen)}. Sources:</div>
    <ul>${DATA.sources.map(s => `<li>${s.home ? `<a href="${esc(s.home)}" target="_blank" rel="noopener">${esc(s.name)}</a>` : esc(s.name)}: ${s.kept} events${s.error ? ` <span class="err">(could not be read: ${esc(s.error)})</span>` : ""}</li>`).join("")}</ul>
    <div>${unlocated} events have no usable location and appear only in the list. Dashed circles mark 25 miles from each town.</div>`;
}

/* ---------- Update ---------- */
function update() {
  const list = visible().sort((a, b) => a.s - b.s);
  const a = dateOf(state.from), b = dateOf(state.to - 1);
  document.getElementById("range-label").textContent =
    (state.to - state.from === 1 ? fmtDay.format(a) : `${fmtShort.format(a)} to ${fmtShort.format(b)}`) +
    `: ${list.length} event${list.length === 1 ? "" : "s"}`;
  document.querySelectorAll(".preset").forEach(p => p.setAttribute("aria-pressed", p.dataset.p === state.preset));
  svg.setAttribute("aria-valuetext", document.getElementById("range-label").textContent);
  renderFilters(); renderTimeline(); renderMap(list); renderList(list);
}

renderFeeds(); renderFooter();
state.preset = "week";
update();
new ResizeObserver(() => { renderTimeline(); map.invalidateSize(); }).observe(svg);
})();
</script>
</body>
</html>

name: Build and publish

on:
  schedule:
    - cron: "15 10 * * *"  # 06:15 New York time (EDT)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      # Venues geocoded in earlier runs, so Nominatim is only asked about new ones.
      - uses: actions/cache@v4
        with:
          path: venues.json
          key: venues-${{ github.run_id }}
          restore-keys: venues-
      - run: localevents build --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
